<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LUXE Residences — Select a Floor Plan</title>
<!--
  Embeddable floor-plan picker for the existing LUXE website.

  This page is self-contained (no external JS/CSS dependencies) and is meant
  to be dropped into the site either as:
    <iframe src="floor-plan-picker.html" style="width:100%;height:800px;border:0"></iframe>
  or linked to directly. It never talks to the parent page (no postMessage
  needed) - selecting a floor plan swaps this same page's content to an
  inline iframe showing that unit's real /viewer/{unit_id} page from the
  LUXE Floor Plan API, with a link back to the picker.

  Configuration - edit the two globals below, or override them from the
  embedding page via a <script> tag placed BEFORE this file loads:
    <script>
      window.LUXE_API_BASE = "https://your-deployment.example.com";
      window.LUXE_UNITS = [ { id: "...", name: "...", tag: "...", thumb: "..." }, ... ];
    </script>
  Defaults point at the live production API and the two units it already
  has real generated/curated room images for.
-->
<style>
  :root{--navy:#0b1f33;--navy2:#0a1a2e;--gold:#c8a24a;--gold-soft:#d8bd7e;--paper:#f5f1e8}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--navy2);color:var(--paper);
    font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #picker{max-width:1100px;margin:0 auto;padding:1.6rem 1rem 2.6rem}
  header{display:flex;align-items:center;gap:.7rem;padding:.2rem 0 1.2rem;
    border-bottom:1px solid rgba(200,162,74,.25);margin-bottom:1.4rem}
  .brand{font-weight:700;letter-spacing:.26em;font-size:.72rem;color:var(--gold)}
  h1{margin:0 0 .2rem;font-size:1.1rem;font-weight:700;letter-spacing:.04em}
  .hint{margin:0 0 1.3rem;font-size:.72rem;color:rgba(245,241,232,.55)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
  .unit-card{border:1px solid rgba(200,162,74,.28);border-radius:14px;overflow:hidden;cursor:pointer;
    background:rgba(255,255,255,.03);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
  .unit-card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 22px rgba(0,0,0,.35)}
  .unit-thumb{width:100%;aspect-ratio:4/3;background-size:cover;background-position:center;background-color:#182634}
  .unit-label{padding:.7rem .85rem}
  .unit-label .name{display:block;font-size:.86rem;font-weight:700;letter-spacing:.02em}
  .unit-label .tag{display:block;margin-top:.2rem;font-size:.62rem;color:var(--gold-soft);letter-spacing:.08em}
  .unit-label .cta{display:block;margin-top:.5rem;font-size:.6rem;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--navy);background:var(--gold);border-radius:16px;padding:.4rem 0;text-align:center}
  .unit-card:hover .cta{background:var(--gold-soft)}

  #viewerWrap{display:none}
  #back{display:inline-flex;align-items:center;gap:.4rem;background:transparent;border:1px solid rgba(200,162,74,.5);
    color:var(--paper);padding:.4rem .85rem;border-radius:20px;font-size:.7rem;letter-spacing:.05em;
    cursor:pointer;margin-bottom:1rem}
  #back:hover{border-color:var(--gold)}
  #unitFrame{width:100%;height:80vh;min-height:560px;border:0;border-radius:12px;
    border:1px solid rgba(200,162,74,.25);display:block;background:#000}

  @media (max-width:520px){
    #grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.7rem}
    #picker{padding:1.2rem .8rem 2rem}
  }
</style>
</head>
<body>
<div id="picker">
  <header><span class="brand">LUXE&nbsp;RESIDENCES</span></header>

  <div id="gridWrap">
    <h1>Select a Floor Plan</h1>
    <p class="hint">Choose a residence below to step into its interactive, room-by-room tour.</p>
    <div id="grid"></div>
  </div>

  <div id="viewerWrap">
    <button id="back" type="button">&larr; Back to floor plans</button>
    <iframe id="unitFrame" src="about:blank" title="LUXE floor plan viewer"></iframe>
  </div>
</div>

<script>
(function(){
  var API_BASE = window.LUXE_API_BASE || "https://ideal-trust-production-50d9.up.railway.app";

  // Curated list the embedding site controls - not a live "list all
  // projects" API call, so only units Alex's team has actually chosen to
  // show here ever appear. Add/remove entries (or override entirely via
  // window.LUXE_UNITS before this file loads) as new units go live.
  var UNITS = window.LUXE_UNITS || [
    {
      id: "residence-a",
      name: "Residence A",
      tag: "1428 BRICKELL · 2BR / 3BA",
      thumb: "https://raw.githubusercontent.com/clinsonpascal-art/floor-plan-viewer/master/backend/static/stock_photos/LUXE_Living_Room.jpg"
    },
    {
      id: "continuum-residence-01",
      name: "Continuum Residence 01",
      tag: "CONTINUUM CLUB & RESIDENCES · 3BR / 3.5BA",
      thumb: "https://raw.githubusercontent.com/clinsonpascal-art/floor-plan-viewer/master/backend/static/stock_photos/LUXE_Living_Room.jpg"
    }
  ];

  var grid = document.getElementById("grid");
  var gridWrap = document.getElementById("gridWrap");
  var viewerWrap = document.getElementById("viewerWrap");
  var frame = document.getElementById("unitFrame");
  var backBtn = document.getElementById("back");

  function openUnit(unit){
    frame.src = API_BASE + "/viewer/" + encodeURIComponent(unit.id);
    gridWrap.style.display = "none";
    viewerWrap.style.display = "block";
    viewerWrap.scrollIntoView({behavior: "smooth", block: "start"});
  }
  function showGrid(){
    frame.src = "about:blank";
    viewerWrap.style.display = "none";
    gridWrap.style.display = "block";
  }
  backBtn.addEventListener("click", showGrid);

  UNITS.forEach(function(unit){
    var card = document.createElement("div");
    card.className = "unit-card";
    card.innerHTML =
      '<div class="unit-thumb" style="background-image:url(' + unit.thumb + ')"></div>' +
      '<div class="unit-label">' +
        '<span class="name">' + unit.name + '</span>' +
        '<span class="tag">' + unit.tag + '</span>' +
        '<span class="cta">View Floor Plan</span>' +
      '</div>';
    card.addEventListener("click", function(){ openUnit(unit); });
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
